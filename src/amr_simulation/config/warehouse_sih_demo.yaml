warehouse:
  world_file: warehouse_sih_demo.sdf
  bounds:
    x: [-12.0, 12.0]
    y: [-9.0, 9.0]
  amr_footprint_diameter_m: 0.36

  zones:
    loading_bay:
      center: [-9.2, 0.0]
      bounds: {x: [-11.5, -7.0], y: [-8.4, 8.4]}
    main_corridor:
      center: [2.5, 0.0]
      bounds: {x: [-6.5, 11.5], y: [-1.22, 1.22]}
    intersection_A:
      center: [0.0, 0.0]
      radius: 1.05
    intersection_B:
      center: [5.0, 0.0]
      radius: 1.10
    narrow_aisle_1:
      entrance_a: [8.0, 1.05]
      entrance_b: [8.0, 7.85]
      center: [8.0, 4.45]
      clear_width_m: 0.90
      length_m: 6.30
    obstacle_demo_area:
      center: [-3.0, 0.0]
      bounds: {x: [-4.5, -1.5], y: [-1.1, 1.1]}
      dynamic_obstacle_spawn: [-3.0, 0.0, 0.32]

  localization_regions:
    gnss_good:
      bounds: {x: [-11.5, -7.0], y: [-8.4, 8.4]}
      mode: GNSS_FIX
    gnss_degraded:
      bounds: {x: [-7.0, -5.0], y: [-8.4, 8.4]}
      mode: GNSS_DEGRADED
    gnss_outage:
      bounds: {x: [-5.0, 11.5], y: [-8.4, 8.4]}
      mode: IDR_ACTIVE

  task_stations:
    pickup_A: [-9.2, -4.8]
    pickup_B: [-9.2, 4.8]
    drop_A: [5.2, -3.4]
    drop_B: [10.2, -6.5]
    charging_station: [-10.2, 0.0]

  robot_spawns:
    # Canonical fleet start: one physical AMR per existing charging slot.
    # Every launch begins from the same 5-bay charging station; an assigned
    # task is the only way an AMR leaves its dock.
    amr_alpha: [-10.2, 0.0, 0.0]
    amr_bravo: [-10.2, 1.8, 0.0]
    amr_charlie: [-10.2, 3.6, 0.0]
    amr_delta: [-10.2, -3.6, 0.0]
    amr_echo: [-10.2, -1.8, 0.0]

  robot_visuals:
    amr_alpha: {label: ALPHA, colour: [1.0, 0.05, 0.05]}
    amr_bravo: {label: BRAVO, colour: [0.05, 0.20, 1.0]}
    amr_charlie: {label: CHARLIE, colour: [0.05, 0.95, 0.15]}
    amr_delta: {label: DELTA, colour: [1.0, 0.35, 0.02]}
    amr_echo: {label: ECHO, colour: [0.65, 0.05, 0.85]}

  stage3_missions:
    amr_alpha: [[-6.2, -4.8], [-5.0, 0.0], [-1.0, 1.5]]
    amr_bravo: [[-6.2, 4.8], [-5.3, 2.2]]
    amr_charlie: [[-8.0, 2.8], [-7.2, 1.5]]
    amr_delta: [[8.0, 2.5]]
    amr_echo: [[8.0, 7.95]]

  stage4_peer_metadata:
    ALPHA: {namespace: /amr_alpha, priority: 3, next_zone: obstacle_area}
    BRAVO: {namespace: /amr_bravo, priority: 4, next_zone: main_corridor}
    CHARLIE: {namespace: /amr_charlie, priority: 5, next_zone: loading_bay}
    DELTA: {namespace: /amr_delta, priority: 2, next_zone: narrow_aisle_1}
    ECHO: {namespace: /amr_echo, priority: 1, next_zone: narrow_aisle_1}

  mission_zones:
    amr_alpha: ['', obstacle_area, intersection_A]
    amr_bravo: ['', '']
    amr_charlie: ['', '']
    amr_delta: [narrow_aisle_1]
    amr_echo: ['']

  stage5:
    prediction: {horizon: 6.0, buffer: 0.75, minimum_speed: 0.35}
    scenarios:
      safe: {}
      crossing:
        stage3_missions:
          amr_alpha: [[-1.5, 0.0]]
          amr_bravo: [[0.0, -1.5]]
        mission_zones:
          amr_alpha: [intersection_A]
          amr_bravo: [intersection_A]
      different_time:
        stage3_missions:
          amr_alpha: [[-1.5, 0.0]]
          amr_bravo: [[0.0, -4.0]]
        mission_zones:
          amr_alpha: [intersection_A]
          amr_bravo: [intersection_A]

      negotiation:
        stage3_missions:
          amr_alpha: [[2.5, 0.0]]
          amr_bravo: [[0.0, 2.5]]
        mission_zones:
          amr_alpha: [intersection_A]
          amr_bravo: [intersection_A]

  stage6:
    # Bounds in metres; retained in the derived launch config used by all nodes.
    hold_margin: 0.40
    exit_margin: 0.40
    waiting_cap: 30.0
    waiting_quantum: 1.0
    eta_quantum: 0.25
    maximum_reroute_detour_m: 2.5
    # Predict/decide early; these affect only the pre-zone negotiation gate.
    safe_deceleration: 0.65
    processing_margin: 0.15
    footprint_margin: 0.45
    safety_margin: 0.55
    minimum_negotiation_distance: 1.5
    maximum_negotiation_distance: 2.0

  dashboard_tasks:
    PICKUP_A_TO_DROP_A: [[-9.2, -4.8], [-6.2, -4.8], [-3.0, 0.0], [0.0, 0.0], [5.2, -3.4]]
    PICKUP_B_TO_DROP_B: [[-9.2, 4.8], [-6.2, 4.8], [-3.0, 0.0], [0.0, 0.0], [5.0, 0.0], [10.2, -6.5]]
    GO_TO_LOADING_BAY: [[-9.2, 0.0]]
    INSPECT_INTERSECTION_A: [[-1.5, 0.0], [0.0, 0.0], [1.5, 0.0]]
    DELIVER_ROUTE_ALPHA: [[-6.2, -2.0], [-3.0, 0.0], [0.0, 0.0], [5.2, -3.4]]
    DELIVER_ROUTE_BRAVO: [[-6.2, 0.0], [0.0, 0.0], [5.0, 0.0], [10.2, -6.5]]
    NARROW_AISLE_PASS: [[8.0, 1.05], [8.0, 4.45], [8.0, 7.85]]
    WAREHOUSE_TRANSFER_1: [[-5.0, 0.0], [0.0, 0.0], [5.0, 0.0]]
    WAREHOUSE_TRANSFER_2: [[5.0, 0.0], [0.0, 0.0], [-5.0, 0.0]]

  dashboard_locations:
    PICKUP_A: [-9.2, -4.8]
    PICKUP_B: [-9.2, 4.8]
    LOADING_BAY: [-9.2, 0.0]
    INTERSECTION_A: [0.0, 0.0]
    NARROW_AISLE: [8.0, 4.45]
    DROP_A: [5.2, -3.4]
    DROP_B: [10.2, -6.5]
    CHARGING_STATION: [-9.8, 0.0]
    INTERSECTION_B: [5.0, 0.0]
    AISLE_SOUTH: [6.0, 0.0]
    AISLE_NORTH: [6.0, 8.2]

  # Navigation metadata only: these coordinates follow the existing rack geometry.
  route_graph:
    clearance: 0.36
    # Shared decentralized refuge resources.  They sit outside stations,
    # controlled zones, aisle portals and the centreline of travel corridors.
    parking_hotspots: [PARK_01, PARK_02, PARK_03, PARK_04, PARK_05, PARK_06]
    charging_station:
      name: CHARGING_STATION
      center: [-10.2, 0.0]
      bounds: {x: [-10.85, -9.55], y: [-4.25, 4.25]}
      slots: [CHARGE_SLOT_1, CHARGE_SLOT_2, CHARGE_SLOT_3, CHARGE_SLOT_4, CHARGE_SLOT_5]
    # Optional safe edges exposed only while locally avoiding the named zone.
    zone_bypasses:
      intersection_B:
        - [DROP_A, MAIN_CORRIDOR_EAST]
    obstacles:
      - [-4.0, -1.0, 1.4, 7.5]
      - [1.0, 4.0, 1.4, 7.5]
      - [-4.0, -1.0, -7.5, -1.4]
      - [1.0, 4.0, -7.5, -1.4]
      - [6.45, 7.55, 1.4, 7.5]
      - [8.45, 9.55, 1.4, 7.5]
      - [-11.575, -11.125, -2.25, 2.25]
    nodes:
      LOADING_BAY: [-9.2, 0.0]
      PICKUP_A: [-9.2, -4.8]
      PICKUP_B: [-9.2, 4.8]
      CHARGING_STATION: [-9.8, 0.0]
      CHARGING_STATION_ENTRY: [-9.55, 0.0]
      CHARGE_SLOT_1: [-10.2, -3.6]
      CHARGE_SLOT_2: [-10.2, -1.8]
      CHARGE_SLOT_3: [-10.2, 0.0]
      CHARGE_SLOT_4: [-10.2, 1.8]
      CHARGE_SLOT_5: [-10.2, 3.6]
      MAIN_CORRIDOR_WEST: [-5.0, 0.0]
      INTERSECTION_A_WEST: [-1.8, 0.0]
      INTERSECTION_A: [0.0, 0.0]
      INTERSECTION_A_EAST: [1.8, 0.0]
      INTERSECTION_A_SOUTH: [0.0, -2.5]
      INTERSECTION_A_NORTH: [0.0, 2.5]
      MAIN_CORRIDOR_MID: [3.3, 0.0]
      INTERSECTION_B: [5.0, 0.0]
      MAIN_CORRIDOR_EAST: [6.8, 0.0]
      DROP_A: [5.2, -3.4]
      DROP_B_APPROACH: [10.2, 0.0]
      DROP_B: [10.2, -6.5]
      AISLE_SOUTH: [6.0, 0.0]
      NARROW_AISLE_SOUTH: [8.0, 0.65]
      NARROW_AISLE_NORTH: [8.0, 8.2]
      AISLE_NORTH: [6.0, 8.2]
      AISLE_SOUTH_HOLD: [9.9, 0.65]
      AISLE_NORTH_HOLD: [9.9, 8.2]
      PARK_01: [-6.2, 1.0]
      PARK_02: [-6.2, -1.0]
      PARK_03: [6.3, 1.0]
      PARK_04: [6.3, -1.0]
      PARK_05: [10.5, 1.0]
      PARK_06: [10.5, -1.0]
    edges:
      - [PICKUP_A, LOADING_BAY]
      - [PICKUP_B, LOADING_BAY]
      - [CHARGING_STATION, LOADING_BAY]
      - [LOADING_BAY, CHARGING_STATION_ENTRY]
      - [CHARGING_STATION_ENTRY, CHARGE_SLOT_1]
      - [CHARGING_STATION_ENTRY, CHARGE_SLOT_2]
      - [CHARGING_STATION_ENTRY, CHARGE_SLOT_3]
      - [CHARGING_STATION_ENTRY, CHARGE_SLOT_4]
      - [CHARGING_STATION_ENTRY, CHARGE_SLOT_5]
      - [LOADING_BAY, MAIN_CORRIDOR_WEST]
      - [MAIN_CORRIDOR_WEST, INTERSECTION_A_WEST]
      - [INTERSECTION_A_WEST, INTERSECTION_A]
      - [INTERSECTION_A_SOUTH, INTERSECTION_A]
      - [INTERSECTION_A_NORTH, INTERSECTION_A]
      - [INTERSECTION_A, INTERSECTION_A_EAST]
      - [INTERSECTION_A_EAST, MAIN_CORRIDOR_MID]
      - [MAIN_CORRIDOR_MID, INTERSECTION_B]
      - [INTERSECTION_B, MAIN_CORRIDOR_EAST]
      - [INTERSECTION_B, DROP_A]
      - [MAIN_CORRIDOR_EAST, AISLE_SOUTH]
      - [MAIN_CORRIDOR_EAST, NARROW_AISLE_SOUTH]
      - [MAIN_CORRIDOR_EAST, DROP_B_APPROACH]
      - [DROP_B_APPROACH, DROP_B]
      - [DROP_B_APPROACH, AISLE_SOUTH_HOLD]
      - [AISLE_SOUTH_HOLD, NARROW_AISLE_SOUTH]
      - [NARROW_AISLE_SOUTH, NARROW_AISLE_NORTH]
      - [NARROW_AISLE_NORTH, AISLE_NORTH]
      - [NARROW_AISLE_NORTH, AISLE_NORTH_HOLD]
      - [MAIN_CORRIDOR_WEST, PARK_01]
      - [MAIN_CORRIDOR_WEST, PARK_02]
      - [MAIN_CORRIDOR_EAST, PARK_03]
      - [MAIN_CORRIDOR_EAST, PARK_04]
      - [DROP_B_APPROACH, PARK_05]
      - [DROP_B_APPROACH, PARK_06]

  fleet_task_routes:
    WAREHOUSE_TRANSFER|PICKUP_A|DROP_A: PICKUP_A_TO_DROP_A
    WAREHOUSE_TRANSFER|PICKUP_B|DROP_B: PICKUP_B_TO_DROP_B
    WAREHOUSE_TRANSFER|LOADING_BAY|INTERSECTION_A: WAREHOUSE_TRANSFER_1
    WAREHOUSE_TRANSFER|INTERSECTION_A|LOADING_BAY: GO_TO_LOADING_BAY
    DELIVERY|PICKUP_A|DROP_A: DELIVER_ROUTE_ALPHA
    DELIVERY|PICKUP_B|DROP_B: DELIVER_ROUTE_BRAVO
    INSPECTION|INTERSECTION_A|INTERSECTION_A: INSPECT_INTERSECTION_A
    INSPECTION|NARROW_AISLE|NARROW_AISLE: NARROW_AISLE_PASS

  golden_routes:
    amr_alpha:
      - [-9.2, -4.8]
      - [-6.2, -2.0]
      - [-3.0, 0.0]
      - [0.0, 0.0]
      - [5.0, 0.0]
      - [5.2, -3.4]
    amr_bravo:
      - [-9.2, 4.8]
      - [-6.2, 0.0]
      - [0.0, 0.0]
      - [5.0, 0.0]
      - [10.2, -6.5]
    amr_charlie:
      - [-10.2, 2.8]
      - [-7.0, 1.5]
      - [-5.0, 0.0]
      - [5.0, 0.0]
      - [-6.0, 0.0]
    amr_delta:
      - [8.0, 0.65]
      - [8.0, 4.45]
      - [8.0, 7.85]
    amr_echo:
      - [8.0, 8.15]
      - [8.0, 4.45]
      - [8.0, 1.05]

  recommended_cameras:
    top_down: {pose: [0.0, 0.0, 25.0, 0.0, 1.5708, 0.0]}
    isometric_overview: {pose: [-17.0, -18.0, 18.0, 0.0, 0.62, 0.78]}
    intersection_closeup: {pose: [-2.5, -5.5, 6.0, 0.0, 0.65, 0.70]}
